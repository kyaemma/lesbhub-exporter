name: Exporter checks
on:
  push:
  pull_request:
jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check generated bundle
        run: python scripts/build.py --check
      - name: Validate export fixtures
        run: python -m unittest discover -s tests -v
  luau-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Download Luau 0.748 tools
        run: |
          curl --fail --silent --show-error --location https://github.com/luau-lang/luau/releases/download/0.748/luau-ubuntu.zip --output /tmp/luau.zip
          mkdir -p /tmp/luau
          unzip -q /tmp/luau.zip -d /tmp/luau
          chmod +x /tmp/luau/luau /tmp/luau/luau-compile
      - name: Compile Luau files
        run: |
          /tmp/luau/luau-compile src/engine.lua > /dev/null
          /tmp/luau/luau-compile src/deep_scripts.lua > /dev/null
          /tmp/luau/luau-compile src/checkpoints.lua > /dev/null
          /tmp/luau/luau-compile src/client_metadata.lua > /dev/null
          /tmp/luau/luau-compile src/gui_reconstruct.lua > /dev/null
          /tmp/luau/luau-compile src/gui_states.lua > /dev/null
          /tmp/luau/luau-compile src/journal.lua > /dev/null
          /tmp/luau/luau-compile src/relations.lua > /dev/null
          /tmp/luau/luau-compile src/report.lua > /dev/null
          /tmp/luau/luau-compile src/runtime_observer.lua > /dev/null
          /tmp/luau/luau-compile src/source_analysis.lua > /dev/null
          /tmp/luau/luau-compile src/ui.lua > /dev/null
          /tmp/luau/luau-compile src/work_budget.lua > /dev/null
          /tmp/luau/luau-compile dist/lesbhub-exporter.lua > /dev/null
          /tmp/luau/luau-compile tests/mock_capture.luau > /dev/null
      - name: Compile public WindUI fork bundle
        run: |
          curl --fail --silent --show-error --location https://raw.githubusercontent.com/kyaemma/lesbhub-ui/main/dist/main.lua --output /tmp/lesbhub-windui.lua
          grep -q "Lesbhub WindUI fork: fit dialog action buttons" /tmp/lesbhub-windui.lua
          grep -q 'if not aw.User.Enabled then return "" end' /tmp/lesbhub-windui.lua
          if grep -q 'aw.User.Anonymous and 1 or ak.LocalPlayer.UserId' /tmp/lesbhub-windui.lua; then
            echo "Unsafe LocalPlayer access remains in compiled user panel"
            exit 1
          fi
          /tmp/luau/luau-compile /tmp/lesbhub-windui.lua > /dev/null
      - name: Run mock client smoke test
        run: |
          python scripts/build_mock.py /tmp/lesbhub-smoke.luau
          /tmp/luau/luau /tmp/lesbhub-smoke.luau
      - name: Run mock UI smoke test
        run: |
          python scripts/build_mock_ui.py /tmp/lesbhub-ui-smoke.luau
          /tmp/luau/luau-compile /tmp/lesbhub-ui-smoke.luau > /dev/null
          /tmp/luau/luau /tmp/lesbhub-ui-smoke.luau
      - name: Verify reconstructed code writer with synthetic sources
        run: |
          python scripts/build_mock_deep.py /tmp/lesbhub-deep-smoke.luau
          /tmp/luau/luau-compile /tmp/lesbhub-deep-smoke.luau > /dev/null
          /tmp/luau/luau /tmp/lesbhub-deep-smoke.luau
      - name: Validate optional Cobalt plugin
        run: |
          /tmp/luau/luau-compile integrations/cobalt/LesbhubRemoteObserver.luau > /dev/null
          /tmp/luau/luau-compile tests/mock_cobalt.luau > /dev/null
          python scripts/build_mock_cobalt.py /tmp/lesbhub-cobalt-smoke.luau
          /tmp/luau/luau /tmp/lesbhub-cobalt-smoke.luau
      - name: Run v0.8 inspection module mocks
        run: |
          python scripts/build_mock_budget.py /tmp/lesbhub-budget-smoke.luau
          python scripts/build_mock_analysis.py /tmp/lesbhub-analysis-smoke.luau
          python scripts/build_mock_runtime.py /tmp/lesbhub-runtime-smoke.luau
          python scripts/build_mock_relations.py /tmp/lesbhub-relations-smoke.luau
          python scripts/build_mock_report.py /tmp/lesbhub-report-smoke.luau
          python scripts/build_mock_resume.py /tmp/lesbhub-resume-smoke.luau
          python scripts/build_mock_search.py /tmp/lesbhub-search-smoke.luau
          python scripts/build_mock_capture_cancel.py /tmp/lesbhub-capture-cancel-smoke.luau
          for mock in /tmp/lesbhub-{budget,analysis,runtime,relations,report,resume,search,capture-cancel}-smoke.luau; do
            /tmp/luau/luau-compile "$mock" > /dev/null
            /tmp/luau/luau "$mock"
          done
      - name: Run v0.9 GUI, journal and checkpoint mocks
        run: |
          python scripts/build_mock_gui_states.py /tmp/lesbhub-gui-states-smoke.luau
          python scripts/build_mock_journal.py /tmp/lesbhub-journal-smoke.luau
          python scripts/build_mock_checkpoints.py /tmp/lesbhub-checkpoints-smoke.luau
          python scripts/build_mock_finalization_race.py /tmp/lesbhub-finalization-race-smoke.luau
          python scripts/build_mock_finalization_join.py /tmp/lesbhub-finalization-join-smoke.luau
          python scripts/build_mock_runtime_journal_e2e.py /tmp/lesbhub-runtime-journal-e2e-smoke.luau
          python scripts/build_mock_full_weak_identity.py /tmp/lesbhub-full-weak-identity-smoke.luau
          python scripts/build_mock_baseline_script_queue.py /tmp/lesbhub-baseline-script-queue-smoke.luau
          python scripts/build_mock_script_burst.py /tmp/lesbhub-script-burst-smoke.luau
          python scripts/build_mock_journal_batching.py /tmp/lesbhub-journal-batching-smoke.luau
          python scripts/build_mock_callback_no_io.py /tmp/lesbhub-callback-no-io-smoke.luau
          python scripts/build_mock_runtime_deferred.py /tmp/lesbhub-runtime-deferred-smoke.luau
          /tmp/luau/luau-compile tests/mock_gui_reconstruct.luau > /dev/null
          /tmp/luau/luau tests/mock_gui_reconstruct.luau
          for mock in /tmp/lesbhub-{gui-states,journal,checkpoints,finalization-race,finalization-join,runtime-journal-e2e,full-weak-identity,baseline-script-queue,script-burst,journal-batching,callback-no-io,runtime-deferred}-smoke.luau; do
            /tmp/luau/luau-compile "$mock" > /dev/null
            /tmp/luau/luau "$mock"
          done
